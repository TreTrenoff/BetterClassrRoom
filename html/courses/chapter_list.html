{% extends "base.html" %}
{% block content %}

<h2>Chapters of "{{ course.title }}"</h2>

<!-- Bouton pour créer un nouveau chapitre -->
<a href="{% url 'chapter_create' course.id %}" >Create New Chapter</a>

<!-- Tableau des chapitres -->
<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for chapter in chapters %}
        <tr>
            <td>{{ chapter.title }}</td>
            <td>
                <a href="{% url 'chapter_view' course.id chapter.id %}">View</a>
                <a href="{% url 'chapter_update' course.id chapter.id %}">Edit</a>
                <a href="{% url 'chapter_delete' course.id chapter.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No chapters found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Bouton retour vers manage courses -->
<a href="{% url 'course_manage' %}">Back to Manage Courses</a>

{% endblock %}
